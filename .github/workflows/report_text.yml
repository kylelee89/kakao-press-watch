# 리포트 원문 수집. 무료 공개 소스는 발간 후 며칠 뒤에 올라오므로 매일 돌며 백필한다.
# 맥이 꺼져 있어도 돌도록 Actions 에서 실행한다.
name: 리포트원문

on:
  schedule:
    - cron: '23 22 * * *'    # 07:23 KST. 정각은 러너가 몰려 지연되기 쉬워 피한다.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: report-text
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pypdf 설치
        run: pip install --quiet pypdf
      - name: 원문 수집
        run: python3 collect_report_text.py
      - name: 변경분 커밋
        run: |
          real=$(git diff -U0 -- data/report_text data/report_sources.json \
            | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' \
            | grep -vE '"(updatedAt|lastAttemptAt)"' | head -1)
          if [ -z "$real" ]; then
            echo "실질 변경 없음, 커밋 생략"
            git checkout -- data || true
            exit 0
          fi
          git add -A data/report_text data/report_sources.json
          git -c user.email=actions@github.com -c user.name="수집 봇" \
              commit -q -m "리포트 원문 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d')"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin main && { echo "푸시 완료"; exit 0; }
            echo "푸시 재시도 $i"; sleep 5
          done
          echo "푸시 실패"; exit 1
